name: Force gate

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: force-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  uncached:
    name: Uncached lint, typecheck, boundaries, build
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 25
    env:
      TURBO_UI: '0'
      CI: 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - name: Set up Bun from package.json
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format check
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Deep-module boundaries
        run: bun run lint:boundaries
      - name: Uncached typecheck
        run: bunx turbo run check --force
      - name: Uncached build
        run: bunx turbo run build --force
